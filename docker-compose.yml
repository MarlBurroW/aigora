services:
  postgres:
    image: postgres:17-alpine
    container_name: politix_postgres
    environment:
      POSTGRES_USER: politix
      POSTGRES_PASSWORD: politix_local_dev
      POSTGRES_DB: politix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U politix -d politix"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
